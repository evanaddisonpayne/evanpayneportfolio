/* Travel map: a flat Mercator chart printed on the page. Transparent, so the section's wave pattern reads as the ocean;
   land is ivory paper with antique hairline coasts, visited countries in brass. Map left, index right; stacks under 860 wide. */
:root {
  color-scheme: light;
  --oxblood: #2B0B10; --ivory: #F2E8D5; --brass: #C49A4A; --antique: #735420; --signal: #FF5B1F;
  --ink: rgba(43, 11, 16, 0.8); --rule: rgba(115, 84, 32, 0.35);
  --display: "Fraunces", "Iowan Old Style", Georgia, serif;
  --caps: "Cormorant SC", "Cormorant Garamond", Georgia, serif;
  --body: "DM Sans", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; color: var(--oxblood); }
body { font-family: var(--body); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
p, h3, ul { margin: 0; padding: 0; }
button { font: inherit; color: inherit; }

.panel { position: relative; display: flex; gap: 48px; width: 100%; aspect-ratio: 1208 / 600; }

/* ---------- map stage ---------- */
.stage { position: relative; flex: 0 0 68%; overflow: hidden; }
svg.map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: pan-y; outline: none; user-select: none; -webkit-user-select: none;
  /* feather every edge so the chart dissolves into the paper instead of ending in a box */
  -webkit-mask-image: linear-gradient(to right, transparent, #000 7%, #000 93%, transparent), linear-gradient(to bottom, transparent, #000 9%, #000 91%, transparent);
  -webkit-mask-composite: source-in; mask-image: linear-gradient(to right, transparent, #000 7%, #000 93%, transparent), linear-gradient(to bottom, transparent, #000 9%, #000 91%, transparent);
  mask-composite: intersect; }
svg.map.dragging { cursor: grabbing; }
svg.map:focus-visible { outline: 1px solid var(--antique); outline-offset: -1px; }
.zoomed path { vector-effect: non-scaling-stroke; }
.grat { fill: none; stroke: rgba(115, 84, 32, 0.16); stroke-width: 0.6; }
.equator { fill: none; stroke: rgba(115, 84, 32, 0.32); stroke-width: 0.6; stroke-dasharray: 2 4; }
.land path { fill: var(--ivory); stroke: rgba(115, 84, 32, 0.55); stroke-width: 0.6; stroke-linejoin: round; }
.land path.been { fill: #E4D1AB; stroke: var(--antique); stroke-width: 0.9; cursor: pointer; }
.land path.home { fill: #EBDDBF; }
.land path.hover { fill: #D9C08E; stroke: var(--oxblood); }
.land path.sel { stroke: var(--signal); stroke-width: 1.6; }
.routes path.r { fill: none; stroke: rgba(43, 11, 16, 0.55); stroke-linecap: round; pointer-events: none; }
.routes path.r.rail { stroke: var(--antique); }
.routes path.r.hot { stroke: var(--signal); }
.routes path.hit { fill: none; stroke: transparent; stroke-width: 10; pointer-events: stroke; cursor: pointer; }
.overlay { pointer-events: none; }
.overlay .ap { fill: var(--ivory); stroke: var(--oxblood); stroke-width: 0.9; pointer-events: all; cursor: pointer; }
.overlay .ap.hot { stroke: var(--signal); }
.overlay text { font-family: var(--caps); font-weight: 600; letter-spacing: 0.08em; paint-order: stroke; stroke: rgba(242, 232, 213, 0.92); stroke-width: 3.5px; stroke-linejoin: round; }
.overlay .city { font-size: 12px; fill: var(--oxblood); }
.overlay .home-label { font-size: 13px; fill: var(--signal); font-weight: 700; }
.overlay .tick { font-size: 11px; fill: var(--antique); stroke-width: 3px; letter-spacing: 0.1em; }
.home-dot { fill: var(--signal); }
.home-ring { fill: none; stroke: var(--signal); stroke-width: 1; }
.home-pulse { fill: none; stroke: var(--signal); stroke-width: 1; transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
@keyframes pulse { from { transform: scale(0.6); opacity: 0.8; } to { transform: scale(3); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .home-pulse { animation: none; opacity: 0; } }

/* controls match the Contact page chips: oxblood outline, filled when active */
.views, .zoom { position: absolute; top: 16px; display: flex; gap: 6px; z-index: 3; }
.views { left: 16px; }
.zoom { right: 16px; }
.views button, .zoom button { font-family: var(--caps); font-weight: 700; font-size: 13px; line-height: normal; letter-spacing: 0.12em; text-transform: uppercase;
  background: var(--ivory); border: 1px solid var(--oxblood); padding: 7px 12px; cursor: pointer; color: var(--oxblood); }
.views button[aria-pressed="true"] { color: var(--ivory); background: var(--oxblood); }
.views button:hover:not([aria-pressed="true"]), .zoom button:hover { color: var(--signal); border-color: var(--signal); }
.zoom button { font-family: var(--body); font-weight: 500; font-size: 16px; letter-spacing: 0; padding: 4px 12px; }
button:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
.hint { position: absolute; right: 16px; bottom: 12px; z-index: 3; font-family: var(--display); font-style: italic; font-weight: 300; font-size: 14px; line-height: normal; color: var(--ink); pointer-events: none; white-space: pre; }
.scale { position: absolute; left: 16px; bottom: 12px; z-index: 3; pointer-events: none; font-family: var(--caps); font-weight: 600; font-size: 11px; letter-spacing: 0.12em; color: var(--antique); }
.scale i { display: block; height: 5px; margin-top: 4px; border: 0.8px solid var(--antique); border-top: 0; }
.status { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 13px; color: var(--ink); z-index: 3; text-align: center; }
.tip { position: absolute; z-index: 4; pointer-events: none; background: var(--ivory); border: 1px solid var(--oxblood); padding: 8px 12px 9px; min-width: 120px; box-shadow: 0 0 0 3px var(--ivory); }
.tip b { display: block; font-family: var(--display); font-weight: 400; font-size: 17px; line-height: 1.2; color: var(--oxblood); }
.tip small { display: block; white-space: nowrap; font-family: var(--caps); font-weight: 600; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--antique); margin-top: 3px; }

/* ---------- index: same typography as the On repeat list above it ---------- */
.index { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 20px; padding: 8px 0 4px; }
.eyebrow { font-family: var(--caps); font-weight: 500; font-size: 18px; line-height: 1.211; letter-spacing: 0.14em; color: var(--antique); text-transform: uppercase; }
.caption { font-size: 16px; line-height: 1.6; color: var(--ink); }
.index h3 { display: flex; justify-content: space-between; padding-top: 14px; border-top: 1px solid var(--rule); font-family: var(--caps); font-weight: 500; font-size: 14px; line-height: normal; letter-spacing: 0.14em; text-transform: uppercase; color: var(--antique); }
.index h3 span { color: var(--oxblood); font-family: var(--display); font-weight: 300; font-size: 16px; letter-spacing: 0; }
#countries { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px; background: transparent; border: 1px solid rgba(43, 11, 16, 0.55); cursor: pointer; color: var(--oxblood);
  font-family: var(--body); font-weight: 500; font-size: 13px; line-height: normal; white-space: nowrap; }
.chip.home { border-color: var(--signal); }
.chip .tag { font-family: var(--caps); font-weight: 700; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--signal); }
.chip:hover { border-color: var(--oxblood); background: rgba(196, 154, 74, 0.18); }
.chip[aria-pressed="true"] { background: var(--oxblood); border-color: var(--oxblood); color: var(--ivory); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 20px; font-family: var(--caps); font-weight: 600; font-size: 12px; line-height: normal; letter-spacing: 0.12em; text-transform: uppercase; color: var(--antique); }
.legend span { display: flex; align-items: center; gap: 9px; }
.legend i { display: inline-block; width: 24px; flex: none; }
.k-route { border-top: 1px solid rgba(43, 11, 16, 0.7); }
.k-rail { border-top: 1px dashed var(--antique); }
.k-visited { height: 10px; background: #E4D1AB; border: 0.9px solid var(--antique); }
.k-home { width: 10px !important; height: 10px; border-radius: 50%; border: 1.5px solid var(--signal); }
.spacer { flex: 1; }
.homebase { display: flex; gap: 8px; font-family: var(--caps); font-weight: 600; font-size: 12px; line-height: normal; letter-spacing: 0.16em; color: var(--antique); border-top: 1px solid var(--rule); padding-top: 13px; flex-wrap: wrap; text-transform: uppercase; }
.homebase span, .homebase b { white-space: pre; }
.homebase b { color: var(--signal); font-weight: 700; }

@media (max-width: 1199px) {
  .panel { aspect-ratio: auto; min-height: 49.67vw; gap: 36px; }
  .stage { flex-basis: 66%; }
  .index { gap: 16px; }
  .caption { font-size: 15px; }
  .chip { padding: 4px 8px; font-size: 12px; }
  .legend { gap: 8px 14px; font-size: 11px; }
  .views button { padding: 6px 9px; font-size: 12px; }
}
/* stacked under 860: map on top, index underneath */
@media (max-width: 859px) {
  .panel { flex-direction: column; aspect-ratio: auto; gap: 24px; }
  .stage { flex: none; width: 100%; height: 460px; }
  .index { flex: none; gap: 18px; padding: 0; }
  .caption { font-size: 16px; }
  .chip { padding: 5px 10px; font-size: 13px; }
}
@media (max-width: 767px) {
  .stage { height: 360px; }
  .views, .zoom { top: 10px; }
  .views { left: 0; }
  .zoom { right: 0; }
  .views { gap: 4px; }
  .views button { padding: 5px 7px; font-size: 11.5px; }
  .zoom button { padding: 3px 10px; }
  .hint { right: 0; bottom: 6px; font-size: 13px; }
  .scale { left: 0; bottom: 6px; }
}
</style>

  const fail = msg => { statusEl.hidden = false; statusEl.textContent = msg; };
  if (!window.d3) { fail("The map needs a script that didn't load. Refresh to try again."); return; }

  const svg = d3.select(svgEl);
  const gZoom = d3.select("#zoomed"), gLand = d3.select("#land"), gRoutes = d3.select("#routes"), gOver = d3.select("#overlay");
  const projection = d3.geoMercator();
  const path = d3.geoPath(projection);
  let W = 0, H = 0, T = d3.zoomIdentity, box = VIEWS.all, selected = null, hotRoute = null, gratStep = 0, world = null;

  // ---------- routes: gentle arcs bowed toward the pole, drawn in base (unzoomed) map space ----------
  const routes = DATA.routes.map(([a, b, n, m, y0, y1], i) => ({ i, a, b, n, rail: m === "R", y0, y1 }));
  const maxN = d3.max(routes, r => r.n);
  const arc = r => {
    const p = projection([AP[r.a][2], AP[r.a][1]]), q = projection([AP[r.b][2], AP[r.b][1]]);
    const mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2, dx = q[0] - p[0], dy = q[1] - p[1], len = Math.hypot(dx, dy) || 1;
    let nx = -dy / len, ny = dx / len; if (ny > 0) { nx = -nx; ny = -ny; }
    const bend = len * (r.rail ? 0.08 : 0.2);
    return `M${p[0]},${p[1]}Q${mx + nx * bend},${my + ny * bend} ${q[0]},${q[1]}`;
  };
  const widthOf = r => 0.7 + 1.5 * Math.sqrt(r.n / maxN);

  // ---------- layout ----------
  function baseProjection() {
    // whole world (360°) spans the stage width at zoom 1
    projection.scale(W / (2 * Math.PI)).translate([W / 2, H / 2]).center([0, 30]);
  }
  function fit(b, pad) {
    const p = projection([b[0], b[3]]), q = projection([b[2], b[1]]);
    const k = Math.max(1, Math.min(KMAX, (pad || 0.86) * Math.min(W / (q[0] - p[0]), H / (q[1] - p[1]))));
    return d3.zoomIdentity.translate(W / 2, H / 2).scale(k).translate(-(p[0] + q[0]) / 2, -(p[1] + q[1]) / 2);
  }
  const zoom = d3.zoom().scaleExtent([1, KMAX])
    .filter(e => {
      if (e.type === "wheel") return e.ctrlKey || e.metaKey;           // trackpad pinch, or ⌘/Ctrl + scroll; plain scroll keeps scrolling the page
      if (e.type === "touchstart") return e.touches.length > 1;        // one finger scrolls the page, two fingers move the map
      if (e.type === "dblclick") return false;                          // handled below (smoother)
      return !e.button;
    })
    .on("start", e => { if (e.sourceEvent && e.sourceEvent.type !== "wheel") svgEl.classList.add("dragging"); hideTip(); })
    .on("zoom", e => { T = e.transform; render(); if (e.sourceEvent) setView(null); })
    .on("end", () => { svgEl.classList.remove("dragging"); box = currentBox(); });
  svg.call(zoom).style("touch-action", "pan-y");

  function currentBox() {
    const [a, b] = corners();
    return [a[0], b[1], b[0], a[1]];
  }
  // lon/lat of the stage's top-left and bottom-right corners, without the ±180° wrap
  function corners() {
    const a = projection.invert(T.invert([0, 0])), b = projection.invert(T.invert([W, H]));
    const degPerPx = 360 / (2 * Math.PI * projection.scale() * T.k);
    const c = projection.invert(T.invert([W / 2, H / 2]));
    a[0] = c[0] - (W / 2) * degPerPx; b[0] = c[0] + (W / 2) * degPerPx;
    return [a, b];
  }
  function go(b, animate) {
    box = b;
    const t = fit(b);
    if (animate && !reduceMotion) svg.transition().duration(1000).ease(d3.easeCubicInOut).call(zoom.transform, t);
    else svg.call(zoom.transform, t);
  }
  function resize() {
    const r = stage.getBoundingClientRect();
    if (!r.width || !r.height) return;
    W = r.width; H = r.height;
    baseProjection();
    const n = projection([180, -62]), s = projection([-180, 84]);
    zoom.extent([[0, 0], [W, H]]).translateExtent([[s[0], s[1]], [n[0], n[1]]]);
    gLand.selectAll("path").attr("d", f => path(f));
    gRoutes.selectAll("path").attr("d", arc);
    d3.select("#equator").attr("d", path({ type: "LineString", coordinates: [[-180, 0], [-90, 0], [0, 0], [90, 0], [180, 0]] }));
    gratStep = 0;
    svg.call(zoom.transform, fit(box));
  }

  // ---------- drawing ----------
  function render() {
    const k = T.k;
    gZoom.attr("transform", T);
    // graticule density follows the zoom
    const step = k < 2.5 ? 20 : k < 6 ? 10 : k < 16 ? 5 : 1;
    if (step !== gratStep) {
      gratStep = step;
      d3.select("#grat").attr("d", path(d3.geoGraticule().extent([[-180, -80], [180.01, 85]]).step([step, step])()));
    }
    gRoutes.selectAll("path.r").attr("stroke-dasharray", r => (r.rail ? "4 3" : null))
      .classed("hot", r => r.i === hotRoute);
    drawOverlay(step);
    drawScale();
  }

  function drawOverlay(step) {
    const k = T.k, place = ll => T.apply(projection(ll));
    const placed = [[0, 0, W, 58], [W - 230, H - 40, W, H], [0, H - 44, 150, H]];   // controls, hint, scale bar
    const free = bx => bx[0] > 4 && bx[2] < W - 4 && bx[1] > 4 && bx[3] < H - 4 &&
      !placed.some(p => !(bx[2] < p[0] || bx[0] > p[2] || bx[3] < p[1] || bx[1] > p[3]));

    // airports
    const pts = Object.keys(AP).filter(id => id !== "ORD").map(id => { const p = place([AP[id][2], AP[id][1]]); return { id, x: p[0], y: p[1] }; })
      .filter(d => d.x > -10 && d.x < W + 10 && d.y > -10 && d.y < H + 10);
    const hotIds = hotRoute == null ? new Set() : new Set([routes[hotRoute].a, routes[hotRoute].b]);
    const ap = gOver.selectAll("circle.ap").data(pts, d => d.id);
    ap.exit().remove();
    ap.enter().append("circle").attr("class", "ap").attr("r", 2.4)
      .on("pointerenter", (e, d) => airportTip(e, d.id)).on("pointerleave", hideTip)
      .on("click", (e, d) => { const a = AP[d.id]; const c = [a[2], a[1]]; const half = 6 / Math.max(1, T.k / 4); go([c[0] - half, c[1] - half / 2, c[0] + half, c[1] + half / 2], true); })
      .merge(ap).attr("cx", d => d.x).attr("cy", d => d.y).classed("hot", d => hotIds.has(d.id));

    // home
    const [hx, hy] = place(HOME);
    let home = gOver.select("g.homeg");
    if (home.empty()) {
      home = gOver.append("g").attr("class", "homeg");
      home.append("circle").attr("class", "home-pulse").attr("r", 5);
      home.append("circle").attr("class", "home-ring").attr("r", 7);
      home.append("circle").attr("class", "home-dot").attr("r", 3.2);
      home.append("text").attr("class", "home-label").text("CHICAGO").attr("x", 12).attr("y", -9);
    }
    home.attr("transform", `translate(${hx},${hy})`).raise();
    placed.push([hx - 9, hy - 22, hx + 76, hy + 9]);

    // city labels, greedy, majors first, more as you zoom in
    const want = pts.filter(d => (MAJOR.has(d.id) && k >= 1.6) || k >= 7).sort((a, b) => MAJOR.has(b.id) - MAJOR.has(a.id));
    const seen = new Set(["Chicago"]), labels = [];
    for (const d of want) {
      const t = city(d.id).toUpperCase(), c = city(d.id);
      if (seen.has(c)) continue;
      const w = t.length * 8.8 + 4, bx = [d.x + 6, d.y - 15, d.x + 6 + w, d.y - 2];
      if (!free(bx)) continue;
      placed.push(bx); seen.add(c); labels.push({ id: c, t, x: d.x + 7, y: d.y - 5 });
    }
    const lb = gOver.selectAll("text.city").data(labels, d => d.id);
    lb.exit().remove();
    lb.enter().append("text").attr("class", "city").merge(lb).text(d => d.t).attr("x", d => d.x).attr("y", d => d.y);

    // degree ticks along the left and bottom edges, like a chart's neatline
    const ticks = [];
    const [tl, br] = corners();
    const tStep = step;
    for (let lat = Math.ceil(br[1] / tStep) * tStep; lat <= tl[1]; lat += tStep) {
      if (lat < -75 || lat > 82) continue;
      const y = place([0, lat])[1], bx = [10, y - 13, 60, y + 2];
      if (y < 70 || y > H - 50 || !free(bx)) continue;
      placed.push(bx);
      ticks.push({ id: "lat" + lat, t: `${Math.abs(lat)}°${lat === 0 ? "" : lat > 0 ? " N" : " S"}`, x: 12, y: y - 4 });
    }
    for (let lon = Math.ceil(tl[0] / tStep) * tStep; lon <= br[0]; lon += tStep) {
      if (lon <= -180 || lon >= 180) continue;
      const x = place([lon, 0])[0], bx = [x + 2, H - 30, x + 54, H - 14];
      if (x < 70 || !free(bx)) continue;
      placed.push(bx);
      ticks.push({ id: "lon" + lon, t: `${Math.abs(lon)}°${lon === 0 ? "" : lon > 0 ? " E" : " W"}`, x: x + 4, y: H - 18 });
    }
    const tk = gOver.selectAll("text.tick").data(ticks, d => d.id);
    tk.exit().remove();
    tk.enter().append("text").attr("class", "tick").merge(tk).text(d => d.t).attr("x", d => d.x).attr("y", d => d.y);
  }

  // scale bar in miles, measured at the map's center latitude
  const scaleEl = document.getElementById("scale");
  function drawScale() {
    const c = projection.invert(T.invert([W / 2, H / 2]));
    if (!c) return;
    const pxPerDeg = T.k * projection.scale() * Math.PI / 180;          // horizontal pixels per degree of longitude
    const miPerDeg = 69.17 * Math.cos(c[1] * Math.PI / 180);
    const target = 110 / pxPerDeg * miPerDeg;                            // miles in ~110px
    const nice = [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000, 2000].reduce((a, b) => (b <= target ? b : a), 1);
    scaleEl.querySelector("span").textContent = `${nice.toLocaleString("en-US")} mi`;
    scaleEl.querySelector("i").style.width = Math.round(nice / miPerDeg * pxPerDeg) + "px";
  }

  // ---------- tooltips ----------
  function localXY(e) { const r = stage.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  function showTip(e, title, sub) {
    const p = localXY(e);
    tip.hidden = false; tip.innerHTML = "";
    const b = document.createElement("b"); b.textContent = title;
    const s = document.createElement("small"); s.textContent = sub;
    tip.append(b, s);
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let x = p[0] + 14, y = p[1] - th / 2;
    if (x + tw > W - 8) x = p[0] - tw - 14;
    y = Math.max(8, Math.min(H - th - 8, y));
    tip.style.left = x + "px"; tip.style.top = y + "px";
  }
  function hideTip() { tip.hidden = true; }
  function airportTip(e, id) {
    const rs = routes.filter(r => r.a === id || r.b === id), n = d3.sum(rs, r => r.n), a = AP[id];
    showTip(e, a[0] + (a[4] ? ` (${a[4]})` : ""), `${rs.length} route${rs.length === 1 ? "" : "s"}  ·  ${n} booking${n === 1 ? "" : "s"}`);
  }
  const years = r => (r.y0 === r.y1 ? r.y0 : `${r.y0} to ${r.y1}`);

  // ---------- countries ----------
  const byIso = new Map(COUNTRIES.map(c => [c.iso, c]));
  function buildLand(features) {
    world = features.map(f => ({ type: "Feature", properties: { name: f.n, iso: f.a }, geometry: { type: f.c.length > 1 ? "MultiPolygon" : "Polygon", coordinates: f.c.length > 1 ? f.c : f.c[0] } }));
    // Natural Earth rings are counter-clockwise; d3 wants clockwise exteriors on the sphere
    world.forEach(f => {
      const fix = poly => { if (d3.geoArea({ type: "Polygon", coordinates: poly }) > 2 * Math.PI) poly.forEach(r => r.reverse()); };
      if (f.geometry.type === "Polygon") fix(f.geometry.coordinates); else f.geometry.coordinates.forEach(fix);
    });
    gLand.selectAll("path").data(world).join("path")
      .attr("d", f => path(f))
      .attr("class", f => { const c = byIso.get(f.properties.iso); return c ? (c.home ? "been home" : "been") : null; })
      .on("pointerenter", function (e, f) {
        const c = byIso.get(f.properties.iso);
        d3.select(this).classed("hover", true).raise();
        gLand.selectAll("path.sel").raise();
        showTip(e, c ? c.name : f.properties.name, c ? (c.home ? "Home" : "Been there") : "Not yet");
      })
      .on("pointermove", (e, f) => { const c = byIso.get(f.properties.iso); showTip(e, c ? c.name : f.properties.name, c ? (c.home ? "Home" : "Been there") : "Not yet"); })
      .on("pointerleave", function () { d3.select(this).classed("hover", false); hideTip(); })
      .on("click", (e, f) => { const c = byIso.get(f.properties.iso); if (c) focusCountry(c); });
    gLand.selectAll("path.been").raise();
  }

  function buildRoutes() {
    const sorted = routes.slice().sort((a, b) => a.n - b.n);
    gRoutes.selectAll("path.r").data(sorted).join("path").attr("class", r => (r.rail ? "r rail" : "r"))
      .attr("d", arc).attr("stroke-width", widthOf);
    gRoutes.selectAll("path.hit").data(sorted).join("path").attr("class", "hit").attr("d", arc)
      .on("pointerenter", (e, r) => { hotRoute = r.i; render(); showTip(e, `${city(r.a)} ⇄ ${city(r.b)}`, `${r.rail ? "Rail" : "Flight"}  ·  ${r.n} booking${r.n === 1 ? "" : "s"}  ·  ${years(r)}`); })
      .on("pointermove", (e, r) => showTip(e, `${city(r.a)} ⇄ ${city(r.b)}`, `${r.rail ? "Rail" : "Flight"}  ·  ${r.n} booking${r.n === 1 ? "" : "s"}  ·  ${years(r)}`))
      .on("pointerleave", () => { hotRoute = null; render(); hideTip(); })
      .on("click", (e, r) => {
        const A = [AP[r.a][2], AP[r.a][1]], B = [AP[r.b][2], AP[r.b][1]];
        const w = Math.max(2, Math.abs(A[0] - B[0])) * 0.3, h = Math.max(1, Math.abs(A[1] - B[1])) * 0.3;
        setView(null); select(null);
        go([Math.min(A[0], B[0]) - w, Math.min(A[1], B[1]) - h, Math.max(A[0], B[0]) + w, Math.max(A[1], B[1]) + h * 2], true);
      });
  }

  // ---------- controls ----------
  function setView(key) { document.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === key))); }
  document.querySelectorAll("[data-view]").forEach(b => b.addEventListener("click", () => { setView(b.dataset.view); select(null); go(VIEWS[b.dataset.view], true); }));
  const zoomBy = f => svg.transition().duration(reduceMotion ? 0 : 400).call(zoom.scaleBy, f);
  document.getElementById("z-in").addEventListener("click", () => { setView(null); zoomBy(1.6); });
  document.getElementById("z-out").addEventListener("click", () => { setView(null); zoomBy(1 / 1.6); });
  svgEl.addEventListener("dblclick", e => {
    e.preventDefault(); setView(null);
    const p = localXY(e);
    svg.transition().duration(reduceMotion ? 0 : 500).call(zoom.scaleBy, e.shiftKey ? 1 / 2 : 2, p);
  });
  svgEl.addEventListener("keydown", e => {
    const step = 60; let hit = true;
    if (e.key === "ArrowLeft") svg.call(zoom.translateBy, step / T.k, 0);
    else if (e.key === "ArrowRight") svg.call(zoom.translateBy, -step / T.k, 0);
    else if (e.key === "ArrowUp") svg.call(zoom.translateBy, 0, step / T.k);
    else if (e.key === "ArrowDown") svg.call(zoom.translateBy, 0, -step / T.k);
    else if (e.key === "+" || e.key === "=") zoomBy(1.6);
    else if (e.key === "-" || e.key === "_") zoomBy(1 / 1.6);
    else hit = false;
    if (hit) { e.preventDefault(); setView(null); box = currentBox(); }
  });
  const isTouch = window.matchMedia && window.matchMedia("(hover: none)").matches;
  const mac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
  document.getElementById("hint").textContent = isTouch ? "Two fingers to pan and zoom" : `Drag to pan  ·  ${mac ? "⌘" : "Ctrl"} + scroll to zoom`;

  // ---------- index ----------
  const holder = document.getElementById("countries");
  document.getElementById("ccount").textContent = String(COUNTRIES.filter(c => !c.home).length);
  const byCountry = {};
  for (const id in AP) (byCountry[AP[id][3]] = byCountry[AP[id][3]] || new Set()).add(city(id));
  const chips = {};
  COUNTRIES.forEach(c => {
    const btn = document.createElement("button"); btn.type = "button"; btn.className = c.home ? "chip home" : "chip"; btn.setAttribute("aria-pressed", "false");
    const nm = document.createElement("span"); nm.textContent = c.name; btn.append(nm);
    if (c.home) { const tg = document.createElement("span"); tg.className = "tag"; tg.textContent = "Home"; btn.append(tg); }
    const cities = byCountry[c.cc] ? [...byCountry[c.cc]] : [];
    if (cities.length) btn.title = c.home ? `${cities.length} cities on the map, from Maui to New York` : cities.join(" · ");
    btn.addEventListener("click", () => focusCountry(c));
    btn.addEventListener("mouseenter", () => gLand.selectAll("path").filter(f => f.properties.iso === c.iso).classed("hover", true));
    btn.addEventListener("mouseleave", () => gLand.selectAll("path.hover").classed("hover", false));
    holder.append(btn); chips[c.cc] = btn;
  });
  function select(c) {
    selected = c;
    Object.entries(chips).forEach(([cc, b]) => b.setAttribute("aria-pressed", String(!!c && c.cc === cc)));
    gLand.selectAll("path").classed("sel", f => !!c && f.properties.iso === c.iso);
    gLand.selectAll("path.sel").raise();
  }
  function focusCountry(c) { select(c); setView(null); go(c.box, true); }

  // ---------- go ----------
  new ResizeObserver(resize).observe(stage);
  buildRoutes();
  resize();
  fetch("/map/world.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(f => { buildLand(f); render(); })
    .catch(() => fail("Country borders didn't load. Routes still work."));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
})();
</script>
